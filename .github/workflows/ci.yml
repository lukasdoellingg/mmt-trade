name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'packages/engine/**'
              - 'scripts/build-wasm.sh'
              - 'odin/**'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
        env:
          VITE_USE_SESSION_MUX: '1'
      - run: npm run audit:prod
      - run: node --test tests/regression/ws-safe.test.mjs
      - run: npm run test:regression
      - run: node scripts/verify-wasm-artifacts.mjs

  engine:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.engine == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Verify toolchain
        run: |
          odin version
          emcc --version
      - name: Install vendored Sokol/cimgui
        run: bash packages/engine/scripts/install-vendor.sh
      - name: Chart runtime build
        run: npm run build:engine:chart
